spring:
  datasource:
    url: jdbc:sqlserver://${DB_HOST}:${DB_PORT};databaseName=${DB_NAME};encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      pool-name: ${DB_POOL_NAME}
      minimum-idle: ${DB_MIN_IDLE}
      maximum-pool-size: ${DB_MAX_POOL_SIZE}
      idle-timeout: ${DB_IDLE_TIMEOUT}
      max-lifetime: ${DB_MAX_LIFETIME}
      connection-timeout: ${DB_CONNECTION_TIMEOUT}
      validation-timeout: ${DB_VALIDATION_TIMEOUT}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
        use_sql_comments: true
    open-in-view: false

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}
